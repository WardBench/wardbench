[project]
name = "wardbench"
version = "0.4.0"
description = "Synthetic FHIR agent benchmark: utility versus policy violations under role, purpose, and Consent. Research toolkit by Vadim Nareyko at Arviser Sp. z o.o. (https://arviser.com)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Vadim Nareyko", email = "contact@arviser.com" }]
keywords = [
  "fhir",
  "llm",
  "benchmark",
  "agent",
  "evaluation",
  "consent",
  "healthcare",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://arviser.com/#open-proof"
Repository = "https://github.com/WardBench/wardbench"
Documentation = "https://arviser.com/llm-quality-audit"
DOI = "https://doi.org/10.5281/zenodo.23664058"
Issues = "https://github.com/WardBench/wardbench/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wardbench*"]
